# Check the bookshop website's links every night, on GitHub's computers.
name: Nightly link check

on:
  schedule:
    - cron: "*/5 * * * *"   # every day at 06:17 UTC
  workflow_dispatch:         # and a "Run workflow" button, for running it by hand

# The least this job needs: read the code, and open or close issues.
permissions:
  contents: read
  issues: write

# Never two runs at once.
concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Get the repository's files
        uses: actions/checkout@v5

      - name: Check the links
        run: bash actions/check-links actions/links.txt

      - name: Open or update an issue
        if: failure() || cancelled()
        run: bash actions/report-issue open report.md

      - name: Close the issue, if every link works again
        if: success()
        run: bash actions/report-issue close

      - name: Tell Healthchecks.io how it went
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_URL" ]; then
            echo "No HC_PING_URL secret is set, so not reporting to Healthchecks.io."
            exit 0
          fi
          code=1
          if [ "$JOB_STATUS" = success ]; then code=0; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL/$code"
          echo "Told Healthchecks.io the job ended with $code ($JOB_STATUS)."
